name: CD

on:
  push:
    branches: [main]

jobs:
  publish-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/qrdine-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/qrdine-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook / SSH Deploy
        run: |
          echo "Add deployment steps here based on hosting provider (e.g., SSH to VPS to pull and restart containers, or trigger webhooks)."
          # Example:
          # curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }}
